<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hva er klokka?</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Подключаем вашу текстуру фона bg.jpg */
            background: #4b2fd0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: max(10px, env(safe-area-inset-top)) 15px 15px;
            box-sizing: border-box;
            color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        /* Фон bg.jpg: фиксированный слой (работает и на iOS/Telegram) */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: #4b2fd0 url('bg.jpg') center / cover no-repeat;
        }

        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2px;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .progress-bar-container {
            flex-grow: 1;
            height: 9px;
            background: rgba(30, 5, 90, 0.45);
            border-radius: 10px;
            margin: 0 15px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 20%;
            background: linear-gradient(90deg, #c7a6ff, #a066ff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .stats-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .header-text {
            text-align: center;
            margin-bottom: 2px;
        }
        h1 {
            margin: 0 0 2px 0;
            font-size: 1.4rem;
        }
        p.subtitle {
            margin: 0;
            color: #ffffff;
            font-size: 0.85rem;
            text-shadow: 0 1px 4px rgba(30,0,90,0.8);
        }

        /* Часы: картинка корпуса + SVG-циферблат и стрелки в тех же координатах (420x600) */
        .watch-container {
            width: 215px;
            aspect-ratio: 420 / 600;
            position: relative;
            margin: 6px auto;
            flex-shrink: 0;
            filter: drop-shadow(0 12px 18px rgba(20, 5, 80, 0.55));
        }
        .watch-bg-img, .watch-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .hand {
            transform-origin: 0 0;
            transition: transform 0.6s cubic-bezier(0.3, 1.5, 0.4, 1);
            filter: drop-shadow(2px 3px 2px rgba(0, 0, 0, 0.45));
        }

        .answer-card {
            width: 100%;
            max-width: 400px;
            background: rgba(60, 10, 90, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
            backdrop-filter: blur(5px);
        }
        .answer-title {
            font-size: 0.8rem;
            color: #ffffff;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .answer-slots {
            min-height: 38px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .word-bank {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
            min-height: 75px;
        }

        .tile {
            padding: 8px 12px;
            background-color: #f3e8ff;
            border-bottom: 4px solid #d8b4fe;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #4a0e4e;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .tile:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .tile.hidden {
            display: none;
        }
        .answer-slots .tile {
            background-color: #e9d5ff;
            border-bottom-width: 3px;
        }

        .action-container {
            width: 100%;
            max-width: 400px;
        }
        button.action-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            border-radius: 14px;
            background-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            border-bottom: 4px solid rgba(0, 0, 0, 0.2);
        }
        button.action-btn.active {
            background-color: #06d6a0;
            color: white;
            border-bottom-color: #059669;
            cursor: pointer;
        }
        button.action-btn.wrong-state {
            background-color: #ff4b4b;
            color: white;
            border-bottom-color: #c52222;
            cursor: pointer;
        }
        
        .feedback {
            width: 100%;
            max-width: 400px;
            margin-bottom: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            min-height: 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .feedback.show { opacity: 1; }
        .correct-text { color: #5ef3c3; }
        .incorrect-text { color: #ff8585; }
    </style>
</head>

    <script>
        (function() {
            const norwegianNumbers = ["tolv", "ett", "to", "tre", "fire", "fem", "seks", "sju", "åtte", "ni", "ti", "elleve"];
            const minutesOptions = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55];
            
            let correctAnswer = "";
            let state = "playing";
            let lives = 5;
            let score = 0;
            let progress = 10;

            const hourHand = document.getElementById('hourHand');
            const minuteHand = document.getElementById('minuteHand');
            const answerBox = document.getElementById('answerBox');
            const wordBank = document.getElementById('wordBank');
            const actionBtn = document.getElementById('actionBtn');
            const feedback = document.getElementById('feedback');
            const livesCount = document.getElementById('livesCount');
            const scoreCount = document.getElementById('scoreCount');
            const progressFill = document.getElementById('progressFill');

            function generateTime() {
                state = "playing";
                answerBox.innerHTML = "";
                wordBank.innerHTML = "";
                feedback.classList.remove('show');
                actionBtn.textContent = "Проверить";
                actionBtn.className = "action-btn";
                
                let h = Math.floor(Math.random() * 12) + 1; 
                let m = minutesOptions[Math.floor(Math.random() * minutesOptions.length)]; 

                updateClockVisuals(h, m);
                calculateCorrectAnswer(h, m);
                generateTiles();
            }

            function updateClockVisuals(h, m) {
                const minuteDeg = m * 6;
                const hourDeg = (h % 12) * 30 + (m / 60) * 30;
                
                minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
                hourHand.style.transform = `rotate(${hourDeg}deg)`;
            }

            function calculateCorrectAnswer(h, m) {
                let currentHourStr = norwegianNumbers[h % 12];
                let nextHourStr = norwegianNumbers[(h + 1) % 12];

                if (m === 0) {
                    correctAnswer = currentHourStr;
                } else if (m === 5) {
                    correctAnswer = `fem over ${currentHourStr}`;
                } else if (m === 10) {
                    correctAnswer = `ti over ${currentHourStr}`;
                } else if (m === 15) {
                    correctAnswer = `kvart over ${currentHourStr}`;
                } else if (m === 20) {
                    correctAnswer = `ti på halv ${nextHourStr}`;
                } else if (m === 25) {
                    correctAnswer = `fem på halv ${nextHourStr}`;
                } else if (m === 30) {
                    correctAnswer = `halv ${nextHourStr}`;
                } else if (m === 35) {
                    correctAnswer = `fem over halv ${nextHourStr}`;
                } else if (m === 40) {
                    correctAnswer = `ti over halv ${nextHourStr}`;
                } else if (m === 45) {
                    correctAnswer = `kvart på ${nextHourStr}`;
                } else if (m === 50) {
                    correctAnswer = `ti på ${nextHourStr}`;
                } else if (m === 55) {
                    correctAnswer = `fem på ${nextHourStr}`;
                }
            }

            function generateTiles() {
                let correctWordsList = correctAnswer.split(" ");
                let allWords = [...correctWordsList];
                
                const distractors = ["halv", "kvart", "over", "på", "fem", "ti",
                    norwegianNumbers[Math.floor(Math.random() * 12)]
                ];
                
                let addedDistractors = 0;
                for (let word of distractors) {
                    if (!allWords.includes(word) && addedDistractors < 4) {
                        allWords.push(word);
                        addedDistractors++;
                    }
                }

                for (let i = allWords.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [allWords[i], allWords[j]] = [allWords[j], allWords[i]];
                }

                allWords.forEach((word) => {
                    let tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.textContent = word;
                    tile.onclick = () => selectWord(word, tile);
                    wordBank.appendChild(tile);
                });
                
                updateButtonState();
            }

            function selectWord(word, originalTile) {
                if (state !== "playing") return;
                originalTile.classList.add('hidden'); 
                
                let answerTile = document.createElement('div');
                answerTile.className = 'tile';
                answerTile.textContent = word;
                answerTile.onclick = () => {
                    if (state !== "playing") return;
                    answerBox.removeChild(answerTile);
                    originalTile.classList.remove('hidden'); 
                    updateButtonState();
                };
                
                answerBox.appendChild(answerTile);
                updateButtonState();
            }

            function updateButtonState() {
                if (answerBox.children.length > 0) {
                    actionBtn.classList.add('active');
                } else {
                    actionBtn.classList.remove('active');
                }
            }

            function checkAnswer() {
                if (state === "success" || state === "failed") {
                    generateTime();
                    return;
                }

                if (answerBox.children.length === 0) return; 

                let currentAnswer = Array.from(answerBox.children)
                                         .map(tile => tile.textContent)
                                         .join(" ");

                if (currentAnswer === correctAnswer) {
                    state = "success";
                    score += 10;
                    progress = Math.min(100, progress + 15);
                    scoreCount.textContent = score;
                    progressFill.style.width = progress + '%';

                    feedback.innerHTML = `<span class="correct-text">Отлично! Riktig! 🎉</span>`;
                    feedback.classList.add('show');
                    actionBtn.textContent = "Продолжить";
                    actionBtn.className = "action-btn active";
                } else {
                    state = "failed";
                    lives = Math.max(0, lives - 1);
                    livesCount.textContent = lives;

                    feedback.innerHTML = `<span class="incorrect-text">Ответ: <strong>${correctAnswer}</strong></span>`;
                    feedback.classList.add('show');
                    actionBtn.textContent = "Понятно";
                    actionBtn.className = "action-btn wrong-state";
                    
                    if (lives <= 0) {
                        setTimeout(() => {
                            alert("Игра окончена! Начинаем заново.");
                            lives = 5;
                            score = 0;
                            progress = 10;
                            livesCount.textContent = lives;
                            scoreCount.textContent = score;
                            progressFill.style.width = progress + '%';
                            generateTime();
                        }, 1500);
                    }
                }
            }

            actionBtn.onclick = checkAnswer;
            generateTime();
        })();
    </script>
</body>
</html>
